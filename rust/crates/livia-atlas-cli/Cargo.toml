[package]
name = "livia-atlas-cli"
version = "0.1.0"
edition = "2021"
description = "High-throughput pure-Rust binary index, shard, and warehouse builder for LIVIA Atlas"

[[bin]]
name = "livia-atlas-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
lzma-rs = "0.3"
tar = "0.4"
sha1 = "0.10"
md-5 = "0.10"
regex = "1.11"
