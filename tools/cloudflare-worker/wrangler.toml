name = "livia-proxy"
main = "worker.js"
compatibility_date = "2026-06-08"
# Free Workers plan supports 100k requests/day — plenty for LIVIA traffic.

# The ?fpSummary=<FBgn> route stream-parses FlyPredictome's ~80 MB summary page server-side, which costs
# CPU far past the free tier's 10 ms limit. It therefore needs Workers PAID with a raised CPU cap.
#
# Free plan (current): keep the block below commented — the worker deploys and the plain ?url= proxy works;
#   fpSummary requests just error out (CPU) and LIVIA falls back to its "search unavailable" note.
# Paid plan: uncomment the two lines below, then `wrangler deploy`, to enable fpSummary.
#
# [limits]
# cpu_ms = 300000   # 5 min ceiling; typical runs are seconds, but hub genes (thousands of partners) can be slow.
